<!DOCTYPE html>
<html>
<head>
  <title>Attendance Result</title>
  <style>
    body {
      background: #0b132b;
      color: white;
      font-family: Arial, sans-serif;
      padding: 40px;
    }

    h1 {
      text-align: center;
      margin-bottom: 30px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }

    th, td {
      border: 1px solid #444;
      padding: 12px;
      text-align: center;
    }

    th {
      background: #1c2541;
    }

    tr:nth-child(even) {
      background: #1c2541;
    }

    .alert {
      background: #ff4d4d;
      color: white;
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 20px;
      font-size: 18px;
      text-align: center;
    }

    .btn {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 25px;
      background: #5bc0be;
      color: black;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>

<body>

<h1>📊 Attendance Result</h1>

{% if message %}
  <div class="alert">⚠️ {{ message }}</div>
{% endif %}

{% if students|length > 0 %}
<table>
  <tr>
    <th>Name</th>
    <th>Status</th>
  </tr>

  {% for s in students %}
  <tr>
    <td>{{ s }}</td>
    <td>Present</td>
  </tr>
  {% endfor %}
</table>
{% endif %}

<div style="text-align:center;">
  <a href="/download_attendance" class="btn">⬇ Download Attendance Excel</a>
  <br><br>
  <a href="/teacher" class="btn">⬅ Back to Teacher Panel</a>
</div>

</body>
</html>
